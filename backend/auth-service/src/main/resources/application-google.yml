# Activate with SPRING_PROFILES_ACTIVE=google plus GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET.
# Authorized redirect URI to register in Google Cloud: http://localhost:8080/login/oauth2/code/google
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email

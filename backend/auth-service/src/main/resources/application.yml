server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/adconnect_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:adconnect}
    password: ${MYSQL_PASSWORD:adconnect_pw}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true

grpc:
  server:
    port: ${GRPC_PORT:9091}

adconnect:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    access-token-ttl: 60m
    refresh-token-ttl: 7d
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  seed:
    admin-email: admin@adconnect.local
    admin-password: ${ADMIN_PASSWORD:Admin@123}
    manager-email: manager@adconnect.local
    manager-password: ${MANAGER_PASSWORD:Manager@123}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

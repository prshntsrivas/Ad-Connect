name: adconnect

# Local infrastructure for Ad-Connect.
#   docker compose up -d                 -> databases, broker, search, mail
#   docker compose --profile apps up -d  -> also builds and runs every service + frontend

services:
  mysql:
    image: mysql:8.4
    container_name: adconnect-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-adconnect_root}
      MYSQL_USER: ${MYSQL_USER:-adconnect}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-adconnect_pw}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-adconnect_root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7.0
    container_name: adconnect-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: adconnect-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: adconnect-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: adconnect-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: adconnect
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: adconnect-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: adconnect-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # ---------------------------------------------------------------- apps profile
  discovery-server:
    profiles: ["apps"]
    build: { context: ./backend, args: { MODULE: discovery-server } }
    ports: ["8761:8761"]

  api-gateway:
    profiles: ["apps"]
    build: { context: ./backend, args: { MODULE: api-gateway } }
    ports: ["8080:8080"]
    environment: &app-env
      EUREKA_URL: http://discovery-server:8761/eureka
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MONGO_URI: mongodb://mongodb:27017
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:29092
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      MAIL_HOST: mailpit
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-bytes}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-internal-token}
    depends_on: [discovery-server, redis]

  auth-service:
    profiles: ["apps"]
    build: { context: ./backend, args: { MODULE: auth-service } }
    environment: *app-env
    depends_on: [discovery-server, mysql, kafka]

  campaign-service:
    profiles: ["apps"]
    build: { context: ./backend, args: { MODULE: campaign-service } }
    environment: *app-env
    depends_on: [discovery-server, mysql, kafka, redis]

  search-service:
    profiles: ["apps"]
    build: { context: ./backend, args: { MODULE: search-service } }
    environment: *app-env
    depends_on: [discovery-server, elasticsearch, kafka]

  chat-service:
    profiles: ["apps"]
    build: { context: ./backend, args: { MODULE: chat-service } }
    environment: *app-env
    depends_on: [discovery-server, mongodb, redis, kafka]

  payment-service:
    profiles: ["apps"]
    build: { context: ./backend, args: { MODULE: payment-service } }
    environment: *app-env
    depends_on: [discovery-server, mysql, kafka]

  notification-service:
    profiles: ["apps"]
    build: { context: ./backend, args: { MODULE: notification-service } }
    environment: *app-env
    depends_on: [discovery-server, mongodb, kafka, mailpit]

  frontend:
    profiles: ["apps"]
    build: { context: ./frontend }
    ports: ["5173:80"]
    depends_on: [api-gateway]

volumes:
  mysql-data:
  mongo-data:
  es-data:

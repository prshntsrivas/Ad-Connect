# Optional Kubernetes skeleton. Point image names at your registry after
# `docker compose --profile apps build`. Infra (MySQL, Kafka, ES, Redis, Mongo)
# is assumed to already be running in the cluster.
apiVersion: apps/v1
kind: Deployment
metadata: { name: discovery-server, namespace: adconnect }
spec:
  replicas: 1
  selector: { matchLabels: { app: discovery-server } }
  template:
    metadata: { labels: { app: discovery-server } }
    spec:
      containers:
        - name: app
          image: adconnect-discovery-server:1.0.0
          ports: [{ containerPort: 8761 }]
---
apiVersion: v1
kind: Service
metadata: { name: discovery-server, namespace: adconnect }
spec:
  selector: { app: discovery-server }
  ports: [{ port: 8761, targetPort: 8761 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: adconnect }
spec:
  replicas: 1
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: app
          image: adconnect-api-gateway:1.0.0
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: adconnect-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: adconnect }
spec:
  type: LoadBalancer
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
